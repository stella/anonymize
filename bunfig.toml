[install]
linker = "isolated"
# 5-day quarantine: reject package versions published
# less than 5 days ago to mitigate supply chain attacks.
minimumReleaseAge = 432_000
# First-party stella packages ship in coordinated release
# waves, so allow fresh internal versions immediately.
minimumReleaseAgeExcludes = [
  # bun-types ships only declarations and must match the pinned Bun runtime.
  "bun-types", # quarantine-expires: 2026-10-27T10:17:50.170Z
  "@stll/oxlint-plugin", # quarantine-excluded-since: 2026-10-16T21:09:03.451Z
  "@stll/typescript-config", # quarantine-excluded-since: 2026-05-31T22:16:56.000Z
  "@stll/oxlint-config", # quarantine-excluded-since: 2026-05-31T22:16:56.000Z
  "@stll/anonymize", # quarantine-excluded-since: 2026-10-22T14:49:00.014Z
  "@stll/anonymize-darwin-arm64", # quarantine-excluded-since: 2026-10-22T14:49:00.014Z
  "@stll/anonymize-darwin-x64", # quarantine-excluded-since: 2026-10-22T14:49:00.014Z
  "@stll/anonymize-data", # quarantine-excluded-since: 2026-10-22T14:49:00.014Z
  "@stll/anonymize-docx", # quarantine-excluded-since: 2026-10-22T14:49:00.014Z
  "@stll/anonymize-linux-arm64-gnu", # quarantine-excluded-since: 2026-10-22T14:49:00.014Z
  "@stll/anonymize-linux-x64-gnu", # quarantine-excluded-since: 2026-10-22T14:49:00.014Z
  "@stll/anonymize-pdf", # quarantine-excluded-since: 2026-10-22T14:49:00.014Z
  "@stll/anonymize-win32-x64-msvc", # quarantine-excluded-since: 2026-10-22T14:49:00.014Z
]

[fmt]
printWidth = 80
ignorePatterns = [
  # Shared generated files (stll-toolchain formatter policy).
  ".ai/shared/**",
  ".agents/skills/**",
  ".claude/skills/**",
  "**/AGENTS.md",
  "**/GEMINI.md",
  "**/CLAUDE.md",
  ".github/dependabot.yml",
  "**/fixtures/**",
  "**/__fixtures__/**",
  "**/testdata/**",
  "**/__snapshots__/**",
  "bun.lock",
  "**/.turbo/**",
  "**/dist/**",
  "packages/benchmark/vendor/**",
  "cliff.toml",
  "packages/",
  "results/",
  "vendor/",
]

[fmt.sortImports]
customGroups = [
  { groupName = "react", elementNamePattern = [
    "react",
    "react-dom",
    "react-dom/**",
  ] },
  { groupName = "stella", elementNamePattern = ["@stll/**"] },
  { groupName = "aliases", elementNamePattern = ["@/**"] },
]
groups = [
  "react",
  ["builtin", "external", "type-builtin", "type-external"],
  "stella",
  "aliases",
  ["parent", "sibling", "index", "type-parent", "type-sibling", "type-index"],
]
newlinesBetween = true
