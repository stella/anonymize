[install]
linker = "isolated"
# 5-day quarantine: reject package versions published
# less than 5 days ago to mitigate supply chain attacks.
minimumReleaseAge = 432000
# First-party stella packages ship in coordinated release
# waves, so allow fresh internal versions immediately.
minimumReleaseAgeExcludes = [
  "@stll/oxlint-config", # quarantine-excluded-since: 2026-10-17T08:48:09.179Z
  "@stll/oxlint-config@1.4.0", # quarantine-expires: 2026-10-22T08:48:09.179Z
  "@stll/oxlint-plugin", # quarantine-excluded-since: 2026-10-10T13:16:33.995Z
  "@stll/typescript-config", # quarantine-excluded-since: 2026-10-10T08:12:38.453Z
]
