name: Setup Bun workspace
description: Install the pinned Node and Bun toolchain with shared Turbo caching

inputs:
  repository-checks:
    description: Run repository-level workflow and lockfile invariants.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        registry-url: https://registry.npmjs.org
        scope: "@stll"

    - if: inputs.repository-checks == 'true'
      name: Verify Bun workflow pin
      shell: bash
      run: |
        node .github/tools/check-bun-workflows.mjs
        node --test .github/tools/check-bun-workflows.test.mjs

    - uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
      with:
        bun-version-file: package.json

    - if: inputs.repository-checks == 'true'
      name: Verify workflow cache policy
      shell: bash
      run: bun .github/tools/check-bun-workflows.mjs --cache-policy

    - name: Turbo remote cache
      uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
      with:
        server-port: "0"

    - name: Install dependencies
      shell: bash
      env:
        # .npmrc may reference NPM_TOKEN, but CI installs must not expose a
        # publish credential to dependency lifecycle scripts.
        NPM_TOKEN: ""
      run: bun ci

    - if: inputs.repository-checks == 'true'
      name: Check bun.lock workspace-version drift
      shell: bash
      run: bun run scripts/check-lockfile-workspace-versions.ts
