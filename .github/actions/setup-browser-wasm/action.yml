name: Setup browser WebAssembly tools
description: Install and verify the exact wasm-bindgen CLI used by release builds

runs:
  using: composite
  steps:
    - name: Install wasm-bindgen CLI
      uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
      with:
        tool: wasm-bindgen-cli@0.2.129

    - name: Verify wasm-bindgen CLI
      shell: bash
      run: test "$(wasm-bindgen --version)" = "wasm-bindgen 0.2.129"
