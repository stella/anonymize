name: Setup browser WebAssembly tools
description: Install and verify the exact wasm-bindgen CLI used by release builds

runs:
  using: composite
  steps:
    - name: Install wasm-bindgen CLI
      uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
      with:
        tool: wasm-bindgen-cli@0.2.130

    - name: Verify wasm-bindgen CLI
      shell: bash
      run: test "$(wasm-bindgen --version)" = "wasm-bindgen 0.2.130"
