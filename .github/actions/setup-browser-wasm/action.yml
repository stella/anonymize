name: Setup browser WebAssembly tools
description: Install and verify the exact wasm-bindgen CLI used by release builds

runs:
  using: composite
  steps:
    - name: Install wasm-bindgen CLI
      uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
      with:
        tool: wasm-bindgen-cli@0.2.128

    - name: Verify wasm-bindgen CLI
      shell: bash
      run: test "$(wasm-bindgen --version)" = "wasm-bindgen 0.2.126"
