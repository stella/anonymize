name: Setup Rust CI
description: Install and cache the pinned Rust toolchain for one CI lane

inputs:
  profile:
    description: Rust lane profile (build, consumer, detached, quality, or scaling).
    required: true
  cache-scope:
    description: Cache namespace shared only by lanes that consume one build graph.
    required: true

runs:
  using: composite
  steps:
    - name: Validate profile
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
      run: |
        case "$PROFILE" in
          build|consumer|detached|quality|scaling) ;;
          *)
            echo "::error::Unknown Rust CI profile: $PROFILE"
            exit 1
            ;;
        esac

    - name: Install stable Rust
      shell: bash
      run: |
        rustup toolchain install 1.99.0 --profile minimal
        rustup default 1.99.0

    - if: inputs.profile == 'build'
      name: Install WebAssembly target
      shell: bash
      run: rustup target add wasm32-unknown-unknown --toolchain 1.99.0

    - if: inputs.profile == 'quality' || inputs.profile == 'detached'
      name: Install Rust quality components
      shell: bash
      run: rustup component add rustfmt clippy --toolchain 1.99.0

    - name: Cache Rust build
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # Supply-chain verdicts require a fresh registry index; cache artifacts only.
        path: |
          ~/.cargo/.crates.toml
          ~/.cargo/.crates2.json
          ~/.cargo/bin/cargo-stella-lint
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
          fuzz/target/
          packages/benchmark/native/nym-adapter/target/
        key: ${{ runner.os }}-cargo-${{ inputs.cache-scope }}-1.99.0-source-lint-a1bd81740ecb4b66999f56d1716e1190c4e7272f-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock', 'packages/benchmark/native/nym-adapter/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ inputs.cache-scope }}-1.99.0-source-lint-a1bd81740ecb4b66999f56d1716e1190c4e7272f-

    - if: inputs.profile == 'quality'
      name: Install stable Rust source lint
      shell: bash
      run: cargo install --git https://github.com/stella/tooling --rev a1bd81740ecb4b66999f56d1716e1190c4e7272f --locked stella_source_lint

    - if: inputs.profile == 'quality'
      uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
      with:
        bun-version-file: package.json

    - if: inputs.profile == 'quality'
      name: Install pinned Rust quality tools
      uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
      with:
        tool: nextest@0.9.145,cargo-deny@0.20.2,cargo-insta@1.49.0

    - if: inputs.profile == 'detached'
      name: Install pinned cargo-deny
      uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
      with:
        tool: cargo-deny@0.20.2
