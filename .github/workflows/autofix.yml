name: autofix.ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - bun.lock

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependabot-bun-dedupe:
    uses: stella/.github/.github/workflows/dependabot-bun-dedupe.yml@7198083e27bdd963cacc0b7d70ca54fe3ec83393
