name: autofix.ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - bun.lock

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependabot-bun-dedupe:
    uses: stella/.github/.github/workflows/dependabot-bun-dedupe.yml@156afa9596e6a469c10e329f459168d34a00e0fd
