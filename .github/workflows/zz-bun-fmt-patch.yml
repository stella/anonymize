name: bun fmt patch (temporary)

on:
  push:
    branches: [chore/bun-144-fmt]

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Scope the formatter ignores to generated paths
        run: |
          sed -i -e '/^  "packages\/",$/d' -e '/^  "results\/",$/d' -e 's|^  "vendor/",$|  "packages/benchmark/results/**",|' bunfig.toml
          git diff -- bunfig.toml
      - run: bun fmt && git diff --binary > bun-fmt.patch && git diff --stat | tail -1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bun-fmt-patch
          path: bun-fmt.patch
