name: Release PR

on:
  push:
    branches: [main]

concurrency:
  group: release-pr-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  version:
    name: Maintain Version Packages PR
    permissions:
      contents: read
    uses: stella/.github/.github/workflows/changeset-release-pr.yml@48aacae31829ce15216a6b766b03a92fd2e84da3
    with:
      bun-version-file: package.json
      sync-cargo-inherited-lock: true
    secrets:
      CHANGELOG_APP_ID: ${{ secrets.CHANGELOG_APP_ID }}
      CHANGELOG_APP_PRIVATE_KEY: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
