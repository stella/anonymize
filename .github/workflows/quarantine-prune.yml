name: Package quarantine prune

on:
  schedule:
    - cron: "31 * * * *"

permissions:
  contents: read

jobs:
  prune:
    name: Remove expired quarantine exceptions
    if: github.repository == 'stella/anonymize'
    permissions:
      contents: read
    uses: stella/.github/.github/workflows/quarantine-prune.yml@7c43baa7e76584907c5b6e2876e1e9962a48518e
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
