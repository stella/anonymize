name: Package quarantine prune

on:
  schedule:
    - cron: "31 * * * *"

permissions:
  contents: read

jobs:
  prune:
    name: Remove expired quarantine exceptions
    if: github.repository == 'stella/anonymize'
    permissions:
      contents: read
    uses: stella/.github/.github/workflows/quarantine-prune.yml@76807b4423de63c1216a1ed7437268c4c1c20d7c
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
