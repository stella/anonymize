name: Release policy

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/release-policy.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - .github/workflows/release-policy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforce:
    name: Enforce release boundaries
    uses: stella/.github/.github/workflows/release-policy.yml@5f2b01d9ed2deb6d6c12361d6732833ce5968ef9
    permissions:
      contents: read
