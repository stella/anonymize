name: Release policy

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/release-policy.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - .github/workflows/release-policy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforce:
    name: Enforce release boundaries
    uses: stella/.github/.github/workflows/release-policy.yml@2664e46f02aea7164ba71bcdd485a686166993a4
    permissions:
      contents: read
